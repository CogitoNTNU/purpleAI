services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: vulnerable-app
    networks:
      - vulnerable-app-network
    # No ports exposed - only accessible through defender on port 8080
  traffic:
    image: grafana/k6
    command: run --quiet /scripts/normal-traffic.js
    volumes:
      - ./traffic:/scripts:ro
    depends_on:
      - defender
    networks:
      - vulnerable-app-network

  defender:
    build: ./defender/defender-agent
    container_name: defender
    ports:
      - "8080:8080"
    environment:
      - IDUNN_BASE_URL
      - IDUNN_API_KEY
      - TARGET=http://vulnerable-app:5000
    networks:
      - vulnerable-app-network
    depends_on:
      - vulnerable-app

networks:
  vulnerable-app-network:
    driver: bridge