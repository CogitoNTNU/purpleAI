services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: vulnerable-app
    networks:
      - backend-network

  traffic:
    image: grafana/k6
    command: run --quiet /gamehost/traffic/normal-traffic.js
    volumes:
      - ./gamehost/traffic:/gamehost/traffic:ro
    environment:
      - TARGET=http://defender:8080
    depends_on:
      - defender
    networks:
      - proxy-network

  defender:
    build:
      context: ..
      dockerfile: src/defender/defender-agent/Dockerfile
    container_name: defender
    ports:
      - "8080:8080"
    environment:
      - IDUNN_BASE_URL
      - IDUNN_API_KEY
      - TARGET=http://vulnerable-app:5000
    networks:
      - proxy-network
      - backend-network
    depends_on:
      - vulnerable-app

# Defender is the only service connected to both networks.
networks:
  proxy-network:
    driver: bridge
  backend-network:
    driver: bridge