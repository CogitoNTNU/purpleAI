services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: vulnerable-app
    ports:
      - "192.168.0.120:5000:5000"
    networks:
      - vulnerable-app-network


  traffic:
    image: grafana/k6
    command: run --quiet /scripts/normal-traffic.js
    volumes:
      - ./traffic:/scripts:ro
    depends_on:
      - vulnerable-app
    networks:
      - vulnerable-app-network

  # The defender agent (add when ready). It reaches the app at
  # http://vulnerable-app:5000 and can receive logs pushed from it.
  # defender:
  #   build: ./defender
  #   container_name: defender
  #   ports:
  #     - "127.0.0.1:9000:9000"
  #   networks:
  #     - vulnerable-app-network


networks:
  vulnerable-app-network:
    driver: bridge