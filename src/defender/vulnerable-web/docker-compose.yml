# docker-compose.yml
services:
  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend:/app
    networks:
      - app_network

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    restart: always
    networks:
      - app_network
    depends_on:
      - backend

  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    networks:
      - app_network
    depends_on:
      - frontend
      - backend

  defender:
    build: ../defender-agent
    ports:
      - "8080:8080"
    environment:
      - IDUNN_BASE_URL
      - IDUNN_API_KEY
      - TARGET=http://backend:8000
    networks:
      - app_network
    depends_on:
      - backend

networks:
  app_network:
    driver: bridge