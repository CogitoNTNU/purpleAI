services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: vulnerable-app
    networks:
      - backend-network

  defender:
    build:
      context: ..
      dockerfile: defender/defender-agent/Dockerfile
    container_name: defender
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      - TARGET=http://vulnerable-app:5000
      - PURPLEAI_LOG_FILE=/var/log/purpleai/events.jsonl
    volumes:
      - ./logs:/var/log/purpleai
    networks:
      - proxy-network
      - backend-network
    depends_on:
      - vulnerable-app

# Defender is the only service connected to both networks.
networks:
  proxy-network:
    driver: bridge
  backend-network:
    driver: bridge
