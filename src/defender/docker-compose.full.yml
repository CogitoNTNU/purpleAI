services:
  vulnerable-app:
    build: ./vulnerable-app
    # Overridable for multi-instance isolation; defaults keep single-run values.
    container_name: ${APP_CONTAINER:-vulnerable-app}
    environment:
      - PURPLEAI_LOG_FILE=/var/log/purpleai/vulnshop.jsonl
    volumes:
      - ${APP_LOGS:-./logs}:/var/log/purpleai
      - ../purpleai_logging.py:/app/purpleai_logging.py:ro
    networks:
      - backend-network

  defender:
    build:
      context: ..
      dockerfile: defender/defender-agent/Dockerfile
    container_name: ${DEF_CONTAINER:-defender}
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      - TARGET=http://vulnerable-app:5000
      - PURPLEAI_LOG_FILE=/var/log/purpleai/events.jsonl
    volumes:
      - ${APP_LOGS:-./logs}:/var/log/purpleai
    networks:
      - proxy-network
      - backend-network
    depends_on:
      - vulnerable-app

# Defender is the only service connected to both networks.
networks:
  proxy-network:
    driver: bridge
  backend-network:
    driver: bridge
