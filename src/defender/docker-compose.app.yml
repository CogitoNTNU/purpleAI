services:
  vulnerable-app:
    build: ./vulnerable-app
    # Container name + host port are overridable so several isolated instances
    # can run side by side (set APP_CONTAINER/APP_PORT + COMPOSE_PROJECT_NAME).
    # Unset, they keep the original single-run values.
    container_name: ${APP_CONTAINER:-vulnerable-app}
    ports:
      - "${APP_PORT:-8080}:5000"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
