services:
  vulnerable-app:
    build: ./vulnerable-app
    container_name: vulnerable-app
    networks:
      - backend-network

  defender:
    build:
      context: .
      dockerfile: ./defender-agent/Dockerfile
    container_name: defender
    ports:
      - "8080:8080"
    environment:
      - IDUNN_BASE_URL
      - IDUNN_API_KEY
      - TARGET=http://vulnerable-app:5000
    networks:
      - proxy-network
      - backend-network
    depends_on:
      - vulnerable-app

# Defender is the only service connected to both networks.
networks:
  proxy-network:
    driver: bridge
  backend-network:
    driver: bridge